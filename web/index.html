<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图像流水线编译引擎 · 验收报告</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c;
    --text:#e6e9ee; --dim:#93a0ad; --accent:#6ea8fe; --good:#4ade80;
    --warn:#fbbf24; --bad:#f87171; --point:#60a5fa; --stencil:#c084fc;
    --scale:#34d399; --stat:#f59e0b; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Hiragino Sans GB","Microsoft YaHei",sans-serif}
  header{padding:28px 32px 18px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 6px;font-size:22px;font-weight:650;letter-spacing:.2px}
  h2{font-size:15px;font-weight:600;margin:0 0 14px;color:var(--text)}
  h3{font-size:13px;font-weight:600;margin:18px 0 8px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.6px}
  .sub{color:var(--dim);font-size:13px}
  .wrap{padding:24px 32px 80px;max-width:1500px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:4px}
  .card .k{color:var(--dim);font-size:12px}
  .card .h{color:var(--dim);font-size:12px;margin-top:6px}
  .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--dim);padding:7px 14px;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--panel2);color:var(--text)}
  .seg button:hover:not(.on){color:var(--text)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:5px 13px;cursor:pointer;font-size:13px;color:var(--dim);white-space:nowrap}
  .chip.on{background:rgba(110,168,254,.14);border-color:var(--accent);color:var(--text)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:20px;margin-bottom:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}}
  svg{display:block;max-width:100%}
  .opgraph .node{cursor:pointer}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--dim);font-size:12px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--panel)}
  tr.sel td{background:rgba(110,168,254,.08)}
  tr:hover td{background:rgba(255,255,255,.03)}
  td.mono,.mono{font-family:var(--mono);font-size:12px}
  .bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;min-width:60px}
  .bar>span{display:block;height:100%;border-radius:4px}
  .muted{color:var(--dim)}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
    border:1px solid var(--line);color:var(--dim);margin-right:5px}
  .pill.point{color:var(--point);border-color:rgba(96,165,250,.4)}
  .pill.stencil{color:var(--stencil);border-color:rgba(192,132,252,.4)}
  .pill.scale{color:var(--scale);border-color:rgba(52,211,153,.4)}
  .pill.stat{color:var(--stat);border-color:rgba(245,158,11,.4)}
  .note{color:var(--dim);font-size:12.5px;line-height:1.7;margin-top:10px}
  .tilemap{position:relative;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;overflow:hidden}
  .tilemap canvas{display:block;width:100%;height:auto}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
  .kv .k{color:var(--dim)}
  .tip{position:fixed;pointer-events:none;background:#0a0d11;border:1px solid var(--line);
    border-radius:8px;padding:8px 11px;font-size:12px;opacity:0;transition:opacity .12s;
    z-index:50;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .scroll{overflow:auto;max-height:520px}
  .foot{color:var(--dim);font-size:12px;border-top:1px solid var(--line);
    padding:18px 32px;margin-top:20px}
  code{font-family:var(--mono);background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>图像处理流水线 · 融合与分块执行引擎</h1>
  <div class="sub" id="subtitle">加载中…</div>
</header>
<div class="wrap">
  <div id="summary" class="cards"></div>

  <div class="toolbar">
    <div class="seg" id="pipeSel"></div>
    <div class="seg" id="sizeSel"></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>算子图与融合分组</h2>
      <div id="opgraph"></div>
      <div class="legend">
        <span><i style="background:var(--point)"></i>逐像素</span>
        <span><i style="background:var(--stencil)"></i>邻域</span>
        <span><i style="background:var(--scale)"></i>缩放</span>
        <span><i style="background:var(--stat)"></i>整图统计 (断点)</span>
        <span><i style="background:#3a4658"></i>融合段边界</span>
      </div>
      <div class="note" id="fusionNote"></div>
    </div>
    <div class="panel">
      <h2>分块方式 <span class="muted" id="tilePlanName"></span></h2>
      <div class="seg" id="segSel" style="margin-bottom:14px"></div>
      <div id="tilemap" class="tilemap"></div>
      <div class="kv" id="tileInfo" style="margin-top:12px"></div>
      <div class="note">每个块独立走完整个融合段。为满足下游邻域/缩放依赖, 块在
        输入侧要多算一圈 halo (即块与块之间的重叠), 这就是"重算的像素"。块越矮,
        重叠占比越高 (<span class="muted">见表格"重算像素"列</span>), 但工作集越小。</div>
    </div>
  </div>

  <div class="panel">
    <h2>各方案对比 <span class="muted" id="cmpSub"></span></h2>
    <div class="scroll"><table id="planTable"></table></div>
    <div class="note" id="planNote"></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>耗时对比</h2>
      <div id="timeChart"></div>
    </div>
    <div class="panel">
      <h2>峰值内存与重算比例</h2>
      <div id="memChart"></div>
    </div>
  </div>

  <div class="panel">
    <h2>自动选择 vs 实测最优 (全部用例)</h2>
    <div class="scroll"><table id="choiceTable"></table></div>
    <div class="note" id="choiceNote"></div>
  </div>
</div>
<div class="tip" id="tip"></div>
<div class="panel">
  <h2>代价模型参数 (本机标定)</h2>
  <div class="kv" id="machineInfo"></div>
</div>
<div class="foot" id="foot"></div>

<script>
const S = {
  report:null, pipe:null, size:null, seg:0,
  colors:{point:'#60a5fa',stencil:'#c084fc',scale:'#34d399',stat:'#f59e0b',
          fusedBand:'#3a4658'},
};
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const fmtMs = ms => ms>=1000 ? (ms/1000).toFixed(2)+' s' : ms.toFixed(1)+' ms';
const fmtMB = b => (b/1e6).toFixed(1)+' MB';
const pct = v => (v*100).toFixed(1)+'%';

fetch('report.json').then(r=>r.json()).then(init).catch(e=>{
  $('#subtitle').textContent='未找到 report.json —— 先运行 python -m imgpipe.report';
  console.error(e);
});

function init(rep){
  S.report=rep;
  const sizes=Object.keys(rep.sizes);
  S.size=sizes.includes('1920x1080')?'1920x1080':sizes[sizes.length-1];
  S.pipe=Object.keys(rep.pipelines)[0];
  renderSummary(); renderMachine();
  renderSelectors();
  renderAll();
  $('#foot').innerHTML =
    `耗时 = 进程 CPU 时间最小值 (共享机器上比墙钟稳定); 峰值内存 = 干净子进程里单次执行的 RSS 增量, `+
    `输入图不计入; 重算 = 实际计算像素 / 唯一像素 − 1。`+
    `机器参数由 <code>python -m imgpipe.calibrate</code> 标定。`;
}

function renderMachine(){
  const m=S.report.machine; const host=$('#machineInfo'); if(!host||!m)return;
  const ops=Object.entries(m.op_ns_per_px).sort((a,b)=>a[1]-b[1])
    .map(([k,v])=>`${k} ${v.toFixed(1)}`).join(' · ');
  host.innerHTML =
    `<span class="k">算子 ns/像素</span><span class="mono">${ops}</span>`+
    `<span class="k">调用开销</span><span class="mono">${(m.call_overhead_ns/1000).toFixed(1)} µs / 次</span>`+
    `<span class="k">带宽曲线</span><span class="mono">${m.bandwidth_points.map(p=>`${(p[0]/1e6).toFixed(0)}MB:${p[1].toFixed(0)}`).join(' · ')} GB/s</span>`;
}

function renderSummary(){
  const s=S.report.summary, c=$('#summary'); c.innerHTML='';
  const cards=[
    ['用例数', s.n_cases, `5 条流水线 × ${Object.keys(S.report.sizes).length} 个尺寸`],
    ['逐像素核对', s.all_correct?'全部通过':'有差异',
      `最大绝对误差 ${s.max_abs_error.toExponential(1)}`, s.all_correct?'good':'bad'],
    ['自动选择 / 实测最优', (s.auto_vs_best_median*100).toFixed(0)+'%',
      `中位差距 · p90 ${(s.auto_vs_best_p90*100).toFixed(0)}%`,
      s.auto_vs_best_median<1.2?'good':'warn'],
    ['相对未融合加速', s.auto_speedup_vs_unfused_median.toFixed(2)+'×',
      `自动方案中位加速`, 'good'],
    ['峰值内存 (相对未融合)', pct(s.peak_rel_auto),
      `自动方案 / 未融合 中位比`, 'good'],
  ];
  for(const [k,v,h,cls] of cards){
    const d=el('div','card');
    d.appendChild(el('div','k',k));
    d.appendChild(el('div','v'+(cls?' '+cls:''),v));
    d.appendChild(el('div','h',h));
    c.appendChild(d);
  }
  $('#subtitle').textContent =
    `融合 · 分块调度 · 按需重算 halo · 整图统计断点 · 自动方案选择`;
}

function renderSelectors(){
  const ps=$('#pipeSel'), ss=$('#sizeSel');
  ps.innerHTML=''; ss.innerHTML='';
  for(const name of Object.keys(S.report.pipelines)){
    const b=el('button',name===S.pipe?'on':'',name);
    b.onclick=()=>{S.pipe=name;S.seg=0;renderSelectors();renderAll();};
    ps.appendChild(b);
  }
  for(const sz of Object.keys(S.report.sizes)){
    const b=el('button',sz===S.size?'on':'',sz);
    b.onclick=()=>{S.size=sz;renderAll();renderSelectors();};
    ss.appendChild(b);
  }
}

function caseOf(){ return S.report.cases.find(c=>c.pipeline===S.pipe && c.size===S.size); }

function renderAll(){
  renderOpGraph();
  renderTileSelector();
  renderTileMap();
  renderPlanTable();
  renderCharts();
  renderChoiceTable();
}

/* ---------- 算子图 ---------- */
function renderOpGraph(){
  const p=S.report.pipelines[S.pipe];
  const host=$('#opgraph'); host.innerHTML='';
  const svgNS='http://www.w3.org/2000/svg';
  const W=Math.max(520, host.clientWidth||600), rowH=66, padY=32;
  const n=p.ops.length;
  const cols=Math.min(n, 4);
  const rows=Math.ceil(n/cols);
  const nodeW=Math.min(150,(W-40-(cols-1)*34)/cols);
  const H=rows*rowH+padY+28;
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('class','opgraph');
  // 每个算子所属段
  const segOf={};
  p.segments.forEach(sg=>sg.op_ids.forEach(i=>segOf[i]=sg));
  const pos=[];
  p.ops.forEach((op,i)=>{
    const r=Math.floor(i/cols), col=i%cols;
    const x=20+col*(nodeW+34), y=padY+r*rowH;
    pos.push([x,y]);
  });
  // 段背景
  const seen=new Set();
  p.segments.forEach(sg=>{
    const xs=sg.op_ids.map(i=>pos[i][0]), ys=sg.op_ids.map(i=>pos[i][1]);
    const x0=Math.min(...xs)-12, x1=Math.max(...xs)+nodeW+12;
    const y0=Math.min(...ys)-12, y1=Math.max(...ys)+54;
    const g=document.createElementNS(svgNS,'rect');
    g.setAttribute('x',x0);g.setAttribute('y',y0);
    g.setAttribute('width',x1-x0);g.setAttribute('height',y1-y0);
    g.setAttribute('rx',12);g.setAttribute('fill','none');
    g.setAttribute('stroke', sg.kind==='stat'?'#f59e0b':'#3a4658');
    g.setAttribute('stroke-dasharray', sg.kind==='stat'?'4 4':'0');
    svg.appendChild(g);
    const lab=document.createElementNS(svgNS,'text');
    lab.setAttribute('x',x0+3);lab.setAttribute('y',y0-5);
    lab.setAttribute('fill', sg.kind==='stat'?'#f59e0b':'#6b7785');
    lab.setAttribute('font-size','10.5');
    lab.textContent = sg.kind==='stat'?'统计断点':'融合段 '+sg.index;
    svg.appendChild(lab);
  });
  // 连线
  for(let i=0;i<n-1;i++){
    const [x0,y0]=pos[i], [x1,y1]=pos[i+1];
    const line=document.createElementNS(svgNS,'path');
    let d;
    if(Math.abs(y0-y1)<1){ d=`M ${x0+nodeW} ${y0+22} L ${x1} ${y1+22}`; }
    else { const mx=x0+nodeW/2; d=`M ${x0+nodeW/2} ${y0+44} L ${mx} ${y0+58} L ${x1+nodeW/2} ${y1-6} L ${x1+nodeW/2} ${y1}`; }
    line.setAttribute('d',d);line.setAttribute('stroke','#3a4658');line.setAttribute('fill','none');
    line.setAttribute('stroke-width','1.5');
    svg.appendChild(line);
  }
  // 节点
  p.ops.forEach((op,i)=>{
    const [x,y]=pos[i];
    const g=document.createElementNS(svgNS,'g');
    g.setAttribute('class','node');
    const r=document.createElementNS(svgNS,'rect');
    r.setAttribute('x',x);r.setAttribute('y',y);
    r.setAttribute('width',nodeW);r.setAttribute('height',44);
    r.setAttribute('rx',9);r.setAttribute('fill','#1e242c');
    r.setAttribute('stroke',S.colors[op.kind]||'#555');r.setAttribute('stroke-width','1.4');
    g.appendChild(r);
    const t1=document.createElementNS(svgNS,'text');
    t1.setAttribute('x',x+11);t1.setAttribute('y',y+19);
    t1.setAttribute('fill','#e6e9ee');t1.setAttribute('font-size','12.5');
    t1.textContent=op.label;
    g.appendChild(t1);
    const t2=document.createElementNS(svgNS,'text');
    t2.setAttribute('x',x+11);t2.setAttribute('y',y+34);
    t2.setAttribute('fill','#93a0ad');t2.setAttribute('font-size','10.5');
    t2.textContent=kindText(op);
    g.appendChild(t2);
    g.addEventListener('mousemove',ev=>showTip(ev, opTip(op, segOf[i])));
    g.addEventListener('mouseleave',hideTip);
    svg.appendChild(g);
  });
  host.appendChild(svg);
  const fused=(p.segments||[]).filter(s=>s.kind==='fused').length;
  document.querySelector('#opgraph').parentElement.querySelector('h2').innerHTML =
    `算子图与融合分组 <span class="muted" style="font-size:12px">· ${p.note||''}</span>`;
  const stats=(p.segments||[]).filter(s=>s.kind==='stat').length;
  $('#fusionNote').innerHTML =
    `${n} 个算子被切成 <b>${fused}</b> 个融合段${stats?` + <b>${stats}</b> 个统计断点`:''}。`+
    `同一段内的相邻逐像素算子合并成一组, 组内一次遍历算完, 不产生中间图。`;
}
function kindText(op){
  if(op.kind==='point') return '逐像素';
  if(op.kind==='stencil') return `邻域 ±${Math.max(op.radius[0],op.radius[1])}`;
  if(op.kind==='scale') return `缩放 ${op.scale[0].toFixed(2)}×`;
  return '整图统计';
}
function opTip(op, seg){
  const ps=Object.entries(op.params||{}).slice(0,4)
    .map(([k,v])=>`${k}=${typeof v==='number'?v.toFixed(3):v}`).join(' ');
  return `<b>${op.name}</b> <span class="pill ${op.kind}">${kindText(op)}</span><br>`+
    `${ps?`<span class="mono">${ps}</span><br>`:''}`+
    `<span class="muted">段 ${seg?seg.index:'-'} · 输出 ${seg?seg.out_dims.join('×'):''}</span>`;
}

/* ---------- 分块 ---------- */
function renderTileSelector(){
  const c=caseOf(); if(!c) return;
  const host=$('#segSel'); host.innerHTML='';
  const segs=[];
  for(const cand of c.candidates){ /* noop */ }
  // 用自动方案里的每段分块
  const auto=S.report.pipelines[S.pipe].auto_tiles?.[S.size];
  const n=(auto&&auto.tiles?auto.tiles.length:1);
  if(S.seg>=n) S.seg=0;
  for(let i=0;i<n;i++){
    const b=el('button', i===S.seg?'on':'', '段 '+i);
    b.onclick=()=>{S.seg=i;renderTileSelector();renderTileMap();};
    host.appendChild(b);
  }
}
function renderTileMap(){
  const auto=S.report.pipelines[S.pipe].auto_tiles?.[S.size];
  const host=$('#tilemap'); host.innerHTML='';
  if(!auto||!auto.tiles||!auto.tiles.length){host.textContent='无融合段';return;}
  const seg=auto.tiles[Math.min(S.seg,auto.tiles.length-1)];
  if(!seg){host.textContent='无融合段';return;}
  $('#tilePlanName').textContent = '· '+(auto.plan?auto.plan.name:'');
  const W=seg.out_dims[0], H=seg.out_dims[1];
  const cw=Math.max(260, host.clientWidth||400), ratio=Math.min(1.0, cw/W);
  const cv=document.createElement('canvas');
  cv.width=Math.round(W*ratio); cv.height=Math.max(40, Math.round(H*ratio));
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#13181e';ctx.fillRect(0,0,cv.width,cv.height);
  const sx=cv.width/W, sy=cv.height/H;
  // 块
  const hue = seg.count>1? 200:200;
  seg.rects.forEach((r,i)=>{
    const [x,y,w,h]=r;
    ctx.fillStyle = i%2? 'rgba(110,168,254,.10)':'rgba(110,168,254,.18)';
    ctx.fillRect(x*sx,y*sy,w*sx,h*sy);
    ctx.strokeStyle='rgba(110,168,254,.55)';ctx.lineWidth=1;
    ctx.strokeRect(x*sx+.5,y*sy+.5,Math.max(0,w*sx-1),Math.max(0,h*sy-1));
    // halo
    if(seg.tile){
      const hx=Math.min(x, 8), hy=Math.min(y, 8); // 仅示意 halo 边界
    }
  });
  // 每块左上角标序号 (块很多时只标前 24 个, 避免刷屏)
  if(seg.count<=24){
    ctx.fillStyle='rgba(230,233,238,.55)';ctx.font='10px ui-monospace';
    seg.rects.forEach((r,i)=>{ if(r[2]*sx>26&&r[3]*sy>14) ctx.fillText(i, r[0]*sx+4, r[1]*sy+12); });
  }
  host.appendChild(cv);
  const c=caseOf().candidates.find(x=>x.plan===auto.plan?.name)||null;
  $('#tileInfo').innerHTML =
    `<span class="k">输出画布</span><span class="mono">${W} × ${H}</span>`+
    `<span class="k">块尺寸</span><span class="mono">${seg.tile?seg.tile[0]+' × '+seg.tile[1]:'整图'}</span>`+
    `<span class="k">块数</span><span class="mono">${seg.count}</span>`+
    `<span class="k">自动方案</span><span class="mono">${auto.plan?auto.plan.name:''}</span>`;
}

/* ---------- 方案对比表 ---------- */
function renderPlanTable(){
  const c=caseOf(); if(!c) return;
  const t=$('#planTable'); t.innerHTML='';
  const head=el('tr');
  ['方案','耗时','相对未融合','峰值内存','重算像素','计算像素','整图缓冲','最大误差','']
    .forEach(h=>head.appendChild(el('th',null,h)));
  t.appendChild(head);
  const base=c.candidates.find(x=>x.kind==='unfused')||c.runs.unfused;
  const rows=[...c.candidates].sort((a,b)=>a.seconds-b.seconds);
  const bestFused=rows.find(r=>r.kind!=='unfused');
  const autoName=c.auto_plan.name;
  rows.forEach(r=>{
    const isAuto = (r.plan===autoName) || r.kind==='auto';
    const isBest = bestFused && r.plan===bestFused.plan && r.kind!=='auto';
    const tr=el('tr', isAuto?'sel':'');
    tr.appendChild(el('td',null,
      `${r.plan}${isAuto?' <span class="pill" style="color:var(--good);border-color:rgba(74,222,128,.4)">自动</span>':''}`+
      (isBest?' <span class="pill stat">最快</span>':'')));
    tr.appendChild(el('td','mono',fmtMs(r.seconds_ms)));
    tr.appendChild(el('td','mono', (base.seconds_ms/r.seconds_ms).toFixed(2)+'×'));
    tr.appendChild(el('td','mono', r.peak_mb==null ? '<span class="muted">—</span>' : r.peak_mb.toFixed(1)+' MB'));
    tr.appendChild(el('td','mono',pct(r.recompute)));
    tr.appendChild(el('td','mono',r.computed_px.toLocaleString()));
    tr.appendChild(el('td','mono',String(r.full_buffers)));
    tr.appendChild(el('td','mono',r.max_abs_err.toExponential(1)));
    const bar=el('td'); const b=el('div','bar'); const s=el('span');
    s.style.width=Math.max(2,(r.seconds_ms/base.seconds_ms)*100)+'%';
    s.style.background = r.kind==='unfused'?'#f87171':'#6ea8fe';
    b.appendChild(s); bar.appendChild(b); tr.appendChild(bar);
    tr.addEventListener('mouseenter',ev=>showTip(ev,
      `<b>${r.plan}</b><br>耗时 ${fmtMs(r.seconds_ms)}<br>`+
      `峰值 ${r.peak_mb==null?'—':r.peak_mb.toFixed(1)+' MB'} · 重算 ${pct(r.recompute)}<br>`+
      `<span class="muted">${r.kernel_calls} 次 kernel 调用 · ${r.full_buffers} 个整图缓冲</span>`));
    tr.addEventListener('mousemove',ev=>showTip(ev,null,true));
    tr.addEventListener('mouseleave',hideTip);
    t.appendChild(tr);
  });
  $('#cmpSub').textContent=`· ${c.pipeline} @ ${c.size} (输出 ${c.out_dims.join('×')})`;
  $('#planNote').innerHTML =
    `未融合 = 每个算子整图读写一次, 中间结果整图保留 (业务现状); 融合 = 段内不落中间图; `+
    `融合+分块 = 每块独立走完整段, 只有 tile 大小的工作集。"整图缓冲"是除输入外写出的整图大小画布个数。`+
    `峰值内存只对未融合/融合/自动三个方案实测, 其余候选只测耗时 (显示 —)。`;
}

/* ---------- 图表 ---------- */
function barChart(host, items, unitFmt, colorFn){
  host.innerHTML='';
  const max=Math.max(...items.map(i=>i.v),1e-9);
  const wrap=el('div');
  items.forEach(it=>{
    const row=el('div'); row.style.display='grid';
    row.style.gridTemplateColumns='150px 1fr 78px'; row.style.alignItems='center';
    row.style.gap='10px'; row.style.margin='5px 0';
    row.appendChild(el('div','muted',it.name));
    const bar=el('div','bar'); bar.style.height='14px';
    const s=el('span'); s.style.width=Math.max(1.5,(it.v/max)*100)+'%';
    s.style.background=colorFn?colorFn(it):'#6ea8fe';
    bar.appendChild(s);
    row.appendChild(bar);
    row.appendChild(el('div','mono',unitFmt(it.v)));
    wrap.appendChild(row);
  });
  host.appendChild(wrap);
}
function renderCharts(){
  const c=caseOf(); if(!c) return;
  const pick=['unfused','fused','auto'].map(k=>c.runs[k]).filter(Boolean);
  const extra=c.candidates.filter(r=>!pick.some(p=>p.plan===r.plan))
    .sort((a,b)=>a.seconds-b.seconds).slice(0,3);
  const shown=[...pick,...extra];
  const colors={unfused:'#f87171',fused:'#fbbf24',auto:'#4ade80'};
  barChart($('#timeChart'), shown.map(r=>({name:r.plan,v:r.seconds_ms,kind:r.kind})),
    v=>fmtMs(v), it=>colors[it.kind]||'#6ea8fe');
  const memItems=shown.filter(r=>r.peak_mb!=null).map(r=>({name:r.plan,v:r.peak_mb*1e6,kind:r.kind,rec:r.recompute}));
  barChart($('#memChart'), memItems,
    (v)=>{const r=memItems.find(x=>Math.abs(x.v-v)<1); return fmtMB(v)+(r?` · 重算 ${pct(r.rec)}`:'');},
    it=>colors[it.kind]||'#6ea8fe');
  if(!memItems.length){$('#memChart').innerHTML='<div class="muted">本用例未测峰值内存</div>';}
}

/* ---------- 自动选择 ---------- */
function renderChoiceTable(){
  const t=$('#choiceTable'); t.innerHTML='';
  const head=el('tr');
  ['流水线','尺寸','自动选择','实测最优','自动/最优','相对未融合']
    .forEach(h=>head.appendChild(el('th',null,h)));
  t.appendChild(head);
  const ratios=[];
  S.report.cases.forEach(c=>{
    const tr=el('tr');
    tr.appendChild(el('td',null,c.pipeline));
    tr.appendChild(el('td','mono',c.size));
    tr.appendChild(el('td',null,`${c.auto_plan.name}`));
    tr.appendChild(el('td',null,`${(c.candidates.find(x=>x.kind===c.best_kind)||{}).plan||c.best_kind}`));
    const rr=c.auto_vs_best; ratios.push(rr);
    tr.appendChild(el('td','mono',(rr*100).toFixed(0)+'%'));
    const gain=c.runs.unfused.seconds_ms/(c.candidates.find(x=>x.kind===c.best_kind)||c.runs.auto).seconds_ms;
    tr.appendChild(el('td','mono',gain.toFixed(2)+'×'));
    tr.style.cursor='pointer';
    tr.onclick=()=>{S.pipe=c.pipeline;S.size=c.size;S.seg=0;renderSelectors();renderAll();window.scrollTo(0,0);};
    t.appendChild(tr);
  });
  const med=ratios.slice().sort((a,b)=>a-b)[Math.floor(ratios.length/2)];
  $('#choiceNote').innerHTML =
    `"自动"只用代价模型静态估算, 不执行; "实测最优"把候选池全部真跑一遍取最快。`+
    `两者差距的中位数 ${(med*100).toFixed(0)}%; 点击任一行可跳到该用例。`;
}

/* ---------- tooltip ---------- */
let tipEl=null;
function showTip(ev, html, keep){
  const t=$('#tip');
  if(html!=null) t.innerHTML=html;
  if(!t.innerHTML) return;
  t.style.opacity=1;
  const x=Math.min(window.innerWidth-330, ev.clientX+14);
  const y=Math.min(window.innerHeight-120, ev.clientY+14);
  t.style.left=x+'px'; t.style.top=y+'px';
}
function hideTip(){ $('#tip').style.opacity=0; $('#tip').innerHTML=''; }
window.addEventListener('resize',()=>{if(S.report){renderOpGraph();renderTileMap();}});
</script>
